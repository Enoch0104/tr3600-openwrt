name: Build TR3600 OpenWrt (dual-boot + srun)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget curl jq \
            libelf-dev ccache ecj fastjar java-propose-classpath \
            python3-pyelftools
          git config --global user.email "ci@tr3600.local"
          git config --global user.name "TR3600 CI"

      - name: Build firmware
        run: bash scripts/build.sh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: tr3600-openwrt-firmware
          path: out/
          if-no-files-found: error
          retention-days: 30
